<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1D4E5E"/>
      <stop offset="100%" stop-color="#2E7D68"/>
    </linearGradient>
    <radialGradient id="inner-g" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="badge-drop">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="top-arc"    d="M100,100 m-72,0 a72,72 0 0,1 144,0"/>
    <path id="bottom-arc" d="M100,100 m-68,0 a68,68 0 0,0 136,0"/>
  </defs>

  <!-- Outer circle (shadow) -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-g)" filter="url(#badge-drop)"/>
  <!-- Inner light sheen -->
  <circle cx="100" cy="100" r="96" fill="url(#inner-g)"/>

  <!-- Border rings -->
  <circle cx="100" cy="100" r="91"  fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.8"/>
  <circle cx="100" cy="100" r="83"  fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <!-- ── VOLCANO ICON ── -->
  <!-- Main cone -->
  <path d="M62,124 L100,68 L138,124Z" fill="white" opacity="0.92"/>
  <!-- Flat crater top -->
  <path d="M92,71 L100,64 L108,71 L105,77 L95,77Z" fill="white" opacity="0.92"/>
  <!-- Crater glow -->
  <ellipse cx="100" cy="70" rx="10" ry="5" fill="#fde68a" opacity="0.35" filter="url(#inner-glow)"/>
  <!-- Smoke puffs -->
  <circle cx="100" cy="53" r="6"  fill="white" opacity="0.48"/>
  <circle cx="104" cy="41" r="8"  fill="white" opacity="0.32"/>
  <circle cx="100" cy="28" r="11" fill="white" opacity="0.18"/>

  <!-- ── TEXT ── -->
  <!-- Main: BROMO -->
  <text x="100" y="147"
        text-anchor="middle"
        font-family="'Noto Sans Thai', system-ui, sans-serif"
        font-size="17" font-weight="900"
        fill="white" letter-spacing="5">BROMO</text>

  <!-- Sub: ADVENTURE -->
  <text x="100" y="163"
        text-anchor="middle"
        font-family="'Noto Sans Thai', system-ui, sans-serif"
        font-size="8" font-weight="600"
        fill="rgba(255,255,255,0.65)" letter-spacing="3.5">ADVENTURE</text>

  <!-- Arc text top: EAST JAVA · INDONESIA -->
  <text font-family="'Noto Sans Thai', system-ui, sans-serif"
        font-size="8.5" font-weight="700"
        fill="rgba(255,255,255,0.55)" letter-spacing="2">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">EAST JAVA · INDONESIA</textPath>
  </text>

  <!-- Arc text bottom: JUNE 2026 -->
  <text font-family="'Noto Sans Thai', system-ui, sans-serif"
        font-size="8" font-weight="600"
        fill="rgba(255,255,255,0.45)" letter-spacing="2.5">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">JUNE 2026</textPath>
  </text>

  <!-- ── DECORATIVE ELEMENTS ── -->
  <!-- Top dot -->
  <circle cx="100" cy="10" r="3"   fill="rgba(255,255,255,0.45)"/>
  <!-- Bottom dot -->
  <circle cx="100" cy="190" r="2.5" fill="rgba(255,255,255,0.35)"/>
  <!-- Stars left/right of main text -->
  <text x="62"  y="149" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">✦</text>
  <text x="138" y="149" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.45)">✦</text>
  <!-- Small divider dots -->
  <circle cx="73"  cy="170" r="1.5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="127" cy="170" r="1.5" fill="rgba(255,255,255,0.3)"/>
</svg>
