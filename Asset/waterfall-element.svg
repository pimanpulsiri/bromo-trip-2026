<svg viewBox="0 0 520 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c8e8e0"/>
      <stop offset="100%" stop-color="#eaf6f3"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e3d2e"/>
      <stop offset="100%" stop-color="#0f2218"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2e7d68" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0f3025"/>
    </linearGradient>
    <filter id="mist-f" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <clipPath id="clip-wf">
      <rect width="520" height="640"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip-wf)">
    <!-- Mist background -->
    <rect width="520" height="640" fill="url(#wf-bg)"/>

    <!-- ── CLIFF FACE ── -->
    <path d="M0,0 L520,0 L520,310 Q470,302 420,312 Q370,322 320,308 Q270,295 220,310 Q170,324 120,308 Q70,292 0,305Z" fill="url(#cliff)"/>

    <!-- Cliff lower ledge -->
    <path d="M0,305 Q65,295 130,310 Q195,325 260,305 Q325,285 390,305 Q455,324 520,308 L520,338 Q455,352 390,335 Q325,318 260,338 Q195,358 130,338 Q65,318 0,338Z" fill="#162e20"/>

    <!-- Vegetation top left -->
    <ellipse cx="70"  cy="295" rx="85"  ry="55" fill="#1a3328" opacity="0.95"/>
    <ellipse cx="30"  cy="288" rx="55"  ry="42" fill="#1e3d2e" opacity="0.9"/>
    <ellipse cx="120" cy="280" rx="65"  ry="48" fill="#213824" opacity="0.92"/>
    <!-- Top right -->
    <ellipse cx="450" cy="295" rx="85"  ry="55" fill="#1a3328" opacity="0.95"/>
    <ellipse cx="490" cy="288" rx="55"  ry="42" fill="#1e3d2e" opacity="0.9"/>
    <ellipse cx="400" cy="280" rx="65"  ry="48" fill="#213824" opacity="0.92"/>
    <!-- Center top -->
    <ellipse cx="260" cy="278" rx="90"  ry="40" fill="#1e3d2e" opacity="0.75"/>
    <ellipse cx="220" cy="285" rx="50"  ry="32" fill="#162e22" opacity="0.7"/>
    <ellipse cx="300" cy="282" rx="50"  ry="30" fill="#162e22" opacity="0.7"/>

    <!-- ── WATERFALL STREAMS ── -->
    <!-- Wide curtain — thick primary streams -->
    <g opacity="0.78">
      <line x1="68"  y1="308" x2="64"  y2="515" stroke="white" stroke-width="4.5"/>
      <line x1="92"  y1="305" x2="90"  y2="518" stroke="white" stroke-width="3"/>
      <line x1="118" y1="308" x2="116" y2="512" stroke="white" stroke-width="5"/>
      <line x1="144" y1="304" x2="143" y2="520" stroke="white" stroke-width="3.5"/>
      <line x1="170" y1="306" x2="169" y2="515" stroke="white" stroke-width="4"/>
      <line x1="196" y1="303" x2="195" y2="518" stroke="white" stroke-width="3"/>
      <line x1="222" y1="305" x2="221" y2="512" stroke="white" stroke-width="5.5"/>
      <line x1="248" y1="302" x2="247" y2="520" stroke="white" stroke-width="3.5"/>
      <line x1="274" y1="304" x2="273" y2="515" stroke="white" stroke-width="4.5"/>
      <line x1="300" y1="301" x2="299" y2="518" stroke="white" stroke-width="3"/>
      <line x1="326" y1="303" x2="325" y2="513" stroke="white" stroke-width="5"/>
      <line x1="352" y1="305" x2="351" y2="520" stroke="white" stroke-width="3.5"/>
      <line x1="378" y1="304" x2="377" y2="516" stroke="white" stroke-width="4"/>
      <line x1="404" y1="306" x2="402" y2="518" stroke="white" stroke-width="3"/>
      <line x1="430" y1="308" x2="428" y2="512" stroke="white" stroke-width="4.5"/>
      <line x1="454" y1="306" x2="452" y2="516" stroke="white" stroke-width="3.5"/>
    </g>
    <!-- Thin secondary streams -->
    <g opacity="0.42">
      <line x1="80"  y1="310" x2="78"  y2="510" stroke="white" stroke-width="1.5"/>
      <line x1="106" y1="307" x2="104" y2="514" stroke="white" stroke-width="2"/>
      <line x1="131" y1="306" x2="130" y2="510" stroke="white" stroke-width="1.5"/>
      <line x1="157" y1="305" x2="156" y2="514" stroke="white" stroke-width="1.8"/>
      <line x1="183" y1="305" x2="182" y2="510" stroke="white" stroke-width="1.5"/>
      <line x1="209" y1="304" x2="208" y2="514" stroke="white" stroke-width="2"/>
      <line x1="235" y1="304" x2="234" y2="510" stroke="white" stroke-width="1.5"/>
      <line x1="261" y1="303" x2="260" y2="514" stroke="white" stroke-width="1.8"/>
      <line x1="287" y1="303" x2="286" y2="510" stroke="white" stroke-width="1.5"/>
      <line x1="313" y1="304" x2="312" y2="514" stroke="white" stroke-width="2"/>
      <line x1="339" y1="304" x2="338" y2="510" stroke="white" stroke-width="1.5"/>
      <line x1="365" y1="305" x2="364" y2="514" stroke="white" stroke-width="1.8"/>
      <line x1="391" y1="305" x2="390" y2="510" stroke="white" stroke-width="1.5"/>
      <line x1="417" y1="307" x2="416" y2="514" stroke="white" stroke-width="2"/>
      <line x1="443" y1="307" x2="442" y2="510" stroke="white" stroke-width="1.5"/>
    </g>

    <!-- ── MIST BASE ── -->
    <ellipse cx="260" cy="520" rx="230" ry="65"  fill="white" opacity="0.65" filter="url(#mist-f)"/>
    <ellipse cx="260" cy="535" rx="200" ry="45"  fill="white" opacity="0.5"  filter="url(#mist-f)"/>
    <ellipse cx="260" cy="510" rx="170" ry="30"  fill="white" opacity="0.4"  filter="url(#mist-f)"/>

    <!-- ── POOL ── -->
    <ellipse cx="260" cy="548" rx="210" ry="52"  fill="url(#pool)" opacity="0.72"/>
    <!-- Pool ripple rings -->
    <ellipse cx="260" cy="548" rx="165" ry="36"  fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
    <ellipse cx="260" cy="548" rx="110" ry="22"  fill="none" stroke="white" stroke-width="1"   opacity="0.22"/>
    <ellipse cx="260" cy="548" rx="55"  ry="10"  fill="none" stroke="white" stroke-width="0.8" opacity="0.18"/>
    <!-- Streak reflections -->
    <line x1="175" y1="540" x2="228" y2="536" stroke="white" stroke-width="1.5" opacity="0.28"/>
    <line x1="300" y1="543" x2="360" y2="539" stroke="white" stroke-width="1.2" opacity="0.22"/>
    <line x1="215" y1="552" x2="255" y2="549" stroke="white" stroke-width="1"   opacity="0.18"/>
    <line x1="275" y1="550" x2="315" y2="547" stroke="white" stroke-width="1"   opacity="0.18"/>

    <!-- ── SIDE JUNGLE FRAMES ── -->
    <!-- Left -->
    <path d="M0,330 Q28,310 55,335 Q38,360 0,378Z" fill="#162e20"/>
    <path d="M0,372 Q42,350 72,375 Q52,415 0,435Z" fill="#1a3328"/>
    <path d="M0,428 Q35,412 60,438 Q40,468 0,488Z" fill="#162e20"/>
    <path d="M0,480 Q30,464 52,490 Q32,520 0,540Z" fill="#11221a"/>
    <path d="M0,530 Q25,515 45,540 L0,580Z"         fill="#0d1c15"/>
    <!-- Right -->
    <path d="M520,330 Q492,310 465,335 Q482,360 520,378Z" fill="#162e20"/>
    <path d="M520,372 Q478,350 448,375 Q468,415 520,435Z" fill="#1a3328"/>
    <path d="M520,428 Q485,412 460,438 Q480,468 520,488Z" fill="#162e20"/>
    <path d="M520,480 Q490,464 468,490 Q488,520 520,540Z" fill="#11221a"/>
    <path d="M520,530 Q495,515 475,540 L520,580Z"          fill="#0d1c15"/>

    <!-- ── ROCKS ── -->
    <ellipse cx="110" cy="576" rx="52" ry="22" fill="#112018"/>
    <ellipse cx="410" cy="572" rx="58" ry="24" fill="#112018"/>
    <ellipse cx="260" cy="604" rx="38" ry="16" fill="#0c1912"/>
    <ellipse cx="185" cy="594" rx="28" ry="12" fill="#112018"/>
    <ellipse cx="340" cy="598" rx="32" ry="14" fill="#112018"/>

    <!-- ── DARK GROUND ── -->
    <path d="M0,616 Q130,600 260,614 Q390,628 520,610 L520,640 L0,640Z" fill="#09140f"/>

    <!-- ── LIGHT RAYS (sun through canopy) ── -->
    <path d="M210,0 L165,308 L225,308 L270,0Z"  fill="white" opacity="0.035"/>
    <path d="M340,0 L310,308 L375,308 L405,0Z"  fill="white" opacity="0.03"/>
    <path d="M440,0 L415,308 L465,308 L490,0Z"  fill="white" opacity="0.025"/>
  </g>
</svg>
